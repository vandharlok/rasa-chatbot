# The config recipe.
# https://rasa.com/docs/rasa/model-configuration/
recipe: default.v1



# Configuration for Rasa NLU.
# https://rasa.com/docs/rasa/nlu/components/
language: pt



#review this pipeline

pipeline:
- name: SpacyNLP
  model: pt_core_news_md
  case_sensitive: False
- name: SpacyTokenizer
  case_sensitive: False
- name: SpacyFeaturizer
- name: CountVectorsFeaturizer
  analyzer: char_wb
  min_ngram: 1
  max_ngram: 4
- name: DIETClassifier
  epochs: 38
  learning_rate: 0.0006
  entity_recognition: False  
  constrain_similarities: True
  batch_size: 8  #quantidade de exemplos que sera processado de uma so vez em cada iteracao
  early_stopping_patience: 10
  evaluate_on_number_of_examples: 80
  evaluate_every_number_of_epochs: 1
  tensorboard_log_directory: "./tensorboard/DIET"
  tensorboard_log_level: epoch
- name: FallbackClassifier
  threshold: 0.7
  ambiguity_threshold: 0.2
  core_fallback_action_name: "action_custom_fallback"
- name: DucklingEntityExtractor
  url: http://localhost:8000
  dimensions: ["time", "PhoneNumber"]
  locale: pt_BR
  timezone: "America/Sao_Paulo"


policies:
- name: TEDPolicy
  max_history: 10
  epochs: 60
  batch_size: 
  - 8
  - 16
  early_stopping_patience: 10
  learning_rate: 0.001
  regularization_constant: 0.0011 
  dropout_rate: 0.25
  constrain_similarities: true
  model_confidence: "softmax"
  random_seed: 42
  check_for_contradictions: true
  tensorboard_log_directory: "./tensorboard"
  tensorboard_log_level: epoch
- name: RulePolicy
  core_fallback_threshold: 0.6
  core_fallback_action_name: "action_custom_fallback"
  enable_fallback_prediction: true
  check_for_contradictions: true
  tensorboard_log_directory: "./tensorboard"
  tensorboard_log_level: epoch
- name: AugmentedMemoizationPolicy
  max_history: 10
  check_for_contradictions: true
  tensorboard_log_directory: "./tensorboard"
  tensorboard_log_level: epoch


